name: Noticias CFDsTrader

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write             # para guardar seen.json y no repetir noticias

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar noticias en Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: Guardar historial
        run: |
          git config user.name "cfdstrader-bot"
          git config user.email "cfdstrader-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Actualizar historial de noticias"
          git push
